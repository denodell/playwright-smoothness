# Checks docs/ci.md end to end on one runner (scripts/verify-ci-recipe.sh), runs the Action
# itself against examples/plain-site, and checks that the React example passes, all against the
# package as built from this commit.
name: Examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-audit --no-fund
        working-directory: examples/plain-site
      - run: npx playwright install --with-deps chromium
        working-directory: examples/plain-site
      - run: scripts/verify-ci-recipe.sh

  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # fetch the example's baselines published from main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-audit --no-fund
        working-directory: examples/plain-site
      - uses: ./
        id: smoothness
        with:
          working-directory: examples/plain-site
          artifact-name: plain-site-smoothness-baselines
          comment: 'false'
      - name: Check the Action's outputs
        run: |
          test "${{ steps.smoothness.outputs.outcome }}" = passed
          test -f "examples/plain-site/${{ steps.smoothness.outputs.summary || 'test-results/smoothness/summary.md' }}"

  action-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # fetch the example's baselines published from main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-audit --no-fund
        working-directory: examples/plain-site
      - run: npx playwright install --with-deps chromium
        working-directory: examples/plain-site
      - uses: ./setup
        id: setup
        with:
          artifact-name: plain-site-steps-smoothness-baselines
      - run: npx playwright test
        working-directory: examples/plain-site
      - uses: ./report
        id: report
        if: always()
        with:
          working-directory: examples/plain-site
          comment: 'false'
      - name: Check the steps' outputs
        run: |
          test -n "$SMOOTHNESS_BASELINE_DIR"
          test -f "examples/plain-site/${{ steps.report.outputs.summary }}"
          if [ "${{ steps.setup.outputs.record }}" = true ]; then
            test -n "$(find "$SMOOTHNESS_BASELINE_DIR" -type f)"
          fi

  react-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-audit --no-fund
        working-directory: examples/react-list
      - run: npx playwright install --with-deps chromium
        working-directory: examples/react-list
      - run: npx playwright test
        working-directory: examples/react-list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-list-results
          path: examples/react-list/test-results
