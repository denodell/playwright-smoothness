name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the tag matches both packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in butter-core playwright-butter; do
            actual=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$actual" != "$version" ]; then
              echo "::error::$pkg is $actual, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME isn't on main"
            exit 1
          }

      - name: Use an npm that supports staged publishing
        run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit

      - name: Stage both packages on npm for approval
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in butter-core playwright-butter; do
            if npm view "$pkg@$version" version > /dev/null 2>&1; then
              echo "$pkg@$version is already on npm"
            else
              (cd "packages/$pkg" && npm stage publish)
            fi
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {on=1; next} /^## / && on {exit} on' \
            packages/playwright-butter/CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi

      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
