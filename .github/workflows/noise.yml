# Runs the detection suite five times on the same runner and uploads the spread of every
# number, so tolerances and the calibrate defaults are based on real runner noise.
name: Noise

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC

jobs:
  noise:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: Five runs
        run: |
          for i in 1 2 3 4 5; do
            rm -rf test-results/detection
            npm run test:detection || echo "run $i had failures" >> noise-failures.txt
            mkdir -p noise/run-$i
            cp test-results/detection/*.json noise/run-$i/ || true
          done
      - name: Summarise
        if: always()
        run: |
          node scripts/noise-summary.mjs noise > noise/summary.md
          cat noise/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f noise-failures.txt ]; then cat noise-failures.txt | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noise
          path: noise
          retention-days: 90
