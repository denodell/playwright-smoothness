name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Built package loads as CommonJS and ESM
        run: |
          node -e "const m=require('./dist/index.cjs'); if (typeof m.test !== 'function') process.exit(1)"
          node --input-type=module -e "const m=await import('./dist/index.js'); if (typeof m.test !== 'function') process.exit(1)"
      - run: npm run test:unit

  integration:
    name: Integration suite (the library, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            test-results
            playwright-report
          retention-days: 30

  oldest-playwright:
    name: Integration suite on the oldest supported Playwright (1.49)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Keep in step with peerDependencies in package.json.
      - run: npm install --no-save @playwright/test@1.49.0
      - run: npx playwright --version
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oldest-playwright-results
          path: |
            test-results
            playwright-report
          retention-days: 30

  detection:
    name: Detection suite (Chromium pinned by the locked Playwright version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:detection
      - name: Runner details
        if: always()
        run: |
          mkdir -p test-results/detection
          node -e "const os=require('os');console.log(JSON.stringify({cpus:os.cpus().length,model:os.cpus()[0].model,memGB:Math.round(os.totalmem()/2**30),platform:process.platform,release:os.release()}))" > test-results/detection/runner.json
          cat test-results/detection/runner.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detection-results
          path: |
            test-results/detection
            playwright-report
          retention-days: 30
