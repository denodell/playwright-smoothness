name: playwright-butter
description: Visual smoothness checks for Playwright in CI. Flags PRs that make scrolling or interacting less smooth than previous runs.
author: Den Odell
branding:
  icon: activity
  color: purple

inputs:
  command:
    description: How to run the suite. With `npm run`, end it with `--` so the Action can add Playwright arguments, such as `npm run test:e2e --`.
    default: npx playwright test
  working-directory:
    description: The folder to run in, for a monorepo.
    default: .
  snapshot-dir:
    description: No longer used. Baselines are recorded straight into the folder that's published.
    deprecationMessage: snapshot-dir is no longer used and can be removed.
    default: ''
  results-dir:
    description: Playwright's output directory, relative to the working directory.
    default: test-results
  comment:
    description: Post the summary on the pull request, as one comment that each run updates.
    default: 'true'
  install-browsers:
    description: Install Chromium and its system dependencies first.
    default: 'true'
  artifact-name:
    description: The name main's baselines are published under. Two suites in one repository need different names.
    default: smoothness-baselines
  results-artifact-name:
    description: The name results and replays are uploaded under. Default is one unique to this job.
    default: ''
  token:
    description: "Token for reading main's baselines and posting the comment. Needs `actions: read` and `pull-requests: write`."
    default: ${{ github.token }}

outputs:
  outcome:
    description: '`passed` or `failed`: whether the Playwright run passed.'
    value: ${{ steps.finish.outputs.outcome }}
  summary:
    description: Path to the Markdown summary.
    value: ${{ steps.report.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Set up
      id: setup
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        RESULTS_ARTIFACT: ${{ inputs.results-artifact-name }}
      run: bash "$GITHUB_ACTION_PATH/action/setup.sh"

    - name: Install Chromium
      if: inputs.install-browsers == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install --with-deps chromium

    - name: Fetch main's baselines
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        BASELINES: ${{ steps.setup.outputs.baselines }}
      run: bash "$GITHUB_ACTION_PATH/action/fetch-baselines.sh"

    - name: Run the tests
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
      run: bash "$GITHUB_ACTION_PATH/action/run.sh"

    - name: Summary
      id: report
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        RESULTS_DIR: ${{ inputs.results-dir }}
        STARTED: ${{ steps.setup.outputs.started }}
        COMMENT: ${{ inputs.comment }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bash "$GITHUB_ACTION_PATH/action/report.sh"

    - name: Collect baselines
      id: collect
      if: steps.setup.outputs.record == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/action/collect.sh"

    - name: Publish baselines
      if: steps.collect.outputs.collected == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.setup.outputs.baselines }}
        include-hidden-files: true
        retention-days: 90

    - name: Upload results and replays
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.setup.outputs.results-artifact }}
        path: ${{ inputs.working-directory }}/${{ inputs.results-dir }}
        if-no-files-found: ignore
        retention-days: 14

    - name: Finish
      id: finish
      if: always()
      shell: bash
      env:
        RUN_CODE: ${{ steps.run.outputs.code }}
      run: bash "$GITHUB_ACTION_PATH/action/finish.sh"
