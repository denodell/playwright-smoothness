# Copy to .github/workflows/smoothness.yml. Explained in docs/ci.md.
#
# - Pull requests: quick mode, compared with baselines from main, summary on the PR.
# - Pushes to main: baselines recorded and published.
# - Nightly: full mode (dropped frames, blank rows, CPU profile), compared, then recorded.
name: Smoothness
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pull-requests: write # for the summary comment
  actions: read # to fetch baselines published from main

jobs:
  smoothness:
    # A dedicated runner keeps every job on the same CPU, so every check is compared.
    # On hosted runners use ubuntu-latest: baselines then build up per CPU model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: denodell/playwright-butter@v1
