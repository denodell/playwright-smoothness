# The smoothness steps added to a Playwright workflow you already have. Explained in docs/ci.md.
#
# - Pull requests: compared with baselines from main, summary as a comment.
# - Pushes to main: compared with the previous baselines, then re-recorded and published.
# - Nightly: full mode (dropped frames, blank rows, CPU profile), compared, then re-recorded.
name: Playwright
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pull-requests: write # for the summary comment
  actions: read # to fetch baselines published from main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - uses: denodell/playwright-butter/setup@v1
      - run: npx playwright test
      - uses: denodell/playwright-butter/report@v1
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
